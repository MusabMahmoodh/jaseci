name: CI Cost Benchmark (free ubuntu-latest)

# Benchmark workflow: mirrors the real test-jaseci jobs but on FREE
# ubuntu-latest, to measure free-runner wall-clock vs the Blacksmith baseline.
# Runs on a fork's free runners. Includes a sharded compiler job to measure the
# long-pole fix, and a report job that prints per-job timing as a step summary.
# This file is for measurement only and is not meant to merge to main.

on:
  push:
    branches:
      - 'ci-benchmark/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- long pole: compiler, single runner (compare to Blacksmith ~11.6 min) ----
  compiler-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist watchdog
      - name: Run compiler tests (single)
        run: pytest -x jac/tests/compiler -n auto

  # ---- long pole: compiler, sharded 3 ways across free runners (Finding 2) ----
  compiler-sharded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist pytest-split watchdog
      - name: Run compiler tests (shard ${{ matrix.group }}/3)
        run: pytest jac/tests/compiler -n auto --splits 3 --group ${{ matrix.group }}

  # ---- runtime (compare to Blacksmith ~7.5 min) ----
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist watchdog
      - name: Run runtime + langserve + language tests
        run: pytest -x jac -n auto --ignore=jac/tests/compiler

  # ---- client (compare to Blacksmith ~4.4 min) ----
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist playwright
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Set environment for testing
        run: echo "TEST_ENV=true" >> $GITHUB_ENV
      - name: Run all client tests
        run: pytest -x jac/tests/runtimelib/client -n auto

  # ---- scale matrix (compare to Blacksmith: server 8.3 / data 7.3 / micro 3.3 / misc 2.8 / deploy 1.9) ----
  scale:
    strategy:
      fail-fast: false
      matrix:
        group: [server, data, microservices, deploy, misc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: oven-sh/setup-bun@v2
      - name: Install jac-scale with all test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          jac install -e jac-scale --extras test
          pip install pytest pytest-asyncio
          pip install requests watchdog websockets
      - name: Run ${{ matrix.group }} tests
        run: |
          set +e
          failed=""
          for f in jac-scale/jac_scale/tests/${{ matrix.group }}/test_*.jac; do
            echo "::group::$f"
            pytest -vv -s "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed ${{ matrix.group }} test files:$failed"
            exit 1
          fi

  # ---- light jobs (compare to Blacksmith: mcp 1.4 / desktop 2.0 / solid 1.9) ----
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install jac-mcp and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          jac install -e jac-mcp
          pip install pytest pytest-xdist
      - name: Run jac-mcp tests
        run: pytest -x jac-mcp -n auto

  desktop-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the jac toolchain only
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist
      - name: Run dependency-free desktop tests
        run: pytest -x jac/tests/runtimelib/client/test_desktop_binding.jac -n auto

  solid-jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          pip install pytest pytest-xdist watchdog
      - name: Run Solid jsdom runtime test
        env:
          JAC_CLIENT_INTEGRATION: "1"
        run: pytest -x -vv jac/tests/runtimelib/test_solid_jsdom.jac

  # ---- auto-report: pull this run's per-job timing and print a summary table ----
  report:
    needs: [compiler-single, compiler-sharded, runtime, client, scale, mcp, desktop-native, solid-jsdom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build timing report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Cost Benchmark - free ubuntu-latest timing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Conclusion | Minutes (free) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|---------------:|" >> $GITHUB_STEP_SUMMARY
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.name!="report") | select(.status=="completed") | [.name, .conclusion, (((.completed_at|fromdateiso8601)-(.started_at|fromdateiso8601))/60)] | @tsv' \
            | awk -F'\t' '{printf "| %s | %s | %.1f |\n", $1, $2, $3; sum+=$3} END {printf "| **TOTAL** | | **%.1f** |\n", sum}' \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Blacksmith baseline for the same suite: ~76-80 runner-min/run (paid)._" >> $GITHUB_STEP_SUMMARY
