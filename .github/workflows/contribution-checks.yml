name: Contribution Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'
      - 'docs/scripts/validate_docs_code.jac'
      - '.github/workflows/contribution-checks.yml'
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a run for a commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contribution-checks:
    name: Contribution Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Policy gates (block AI co-author, block new .py files, release-note
      # fragments) moved to the Tier 0 free-runner gate (ci-tiered.yml) + the
      # pre-commit hooks, so they fail in seconds and do not run twice on this
      # paid runner. This job keeps only the docs/manifest validation that needs
      # the full toolchain.

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-jac-${{ hashFiles('jac/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-jac-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
          jac install -e docs

      - name: Validate Jac code block syntax
        run: jac run docs/scripts/validate_docs_code.jac

      - name: Build documentation and check links
        working-directory: docs
        run: mkdocs build --strict 2>&1 | tee build.log || true

      - name: Report link warnings
        working-directory: docs
        run: |
          if grep -i "warning" build.log | grep -i "link"; then
            echo "## ⚠️ Documentation Link Warnings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -i "warning" build.log | grep -i "link" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All Checks Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Jac code block syntax: ✓" >> $GITHUB_STEP_SUMMARY
            echo "- Internal links: ✓" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check plugin manifest sync (jac.toml / pyproject.toml)
        run: |
          pip install tomlkit==0.14.0
          jac run scripts/check_manifest_sync.jac

      # NOTE: "Check Release Notes Updated" moved to the Tier 0 gate (ci-tiered.yml)
      # and the check-release-notes pre-commit hook.
