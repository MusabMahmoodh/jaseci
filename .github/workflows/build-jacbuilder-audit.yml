name: Audit JacBuilder Build Time

# Single-config audit: measure what a fully-plugged JacBuilder costs to
# build across 3 OSes. No variant matrix -- jacBuilder's source
# unconditionally imports jac_coder.runtime / byllm / jac-scale etc., so
# "with vs without" variants can't both compile.
#
# Config (fixed for all 3 jobs):
#   pip install   : jaclang (editable), jac-client (editable), jac-scale,
#                   byllm, jac-mcp, jac-coder (editable from ./jac-code)
#   jac install   : installs jacBuilder's own [dependencies]
#                   (websockets, httpx, watchdog, mcp) before `jac build`
#   [desktop.plugins]: jac_scale=true, byllm=true, jac_coder=true,
#                      jac_mcp=false, jac_client=true

on:
  push:
    paths:
      - .github/workflows/build-jacbuilder-audit.yml
      - jacBuilder/**
      - jac-code/**
  workflow_dispatch:

permissions:
  contents: read

env:
  EXAMPLE_DIR: jacBuilder
  PYTHON_VERSION: "3.12"

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-reg-${{ matrix.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── pip install (timed) ───────────────────────────────────
      - name: Install Jac packages
        id: install
        shell: bash
        run: |
          START=$SECONDS
          pip install --upgrade pip
          pip install -e ./jac
          pip install -e ./jac-client
          pip install jac-scale byllm jac-mcp
          pip install -e ./jac-code
          pip install pyinstaller Pillow
          echo "secs=$((SECONDS-START))" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri CLI
        shell: bash
        run: |
          if command -v cargo-tauri &>/dev/null; then
            echo "cargo-tauri already installed, skipping"
          elif command -v cargo-binstall &>/dev/null || \
               (curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash); then
            cargo binstall tauri-cli --no-confirm --no-discover-github-token || \
              cargo install tauri-cli --locked
          else
            cargo install tauri-cli --locked
          fi

      - name: Setup desktop target
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          rm -rf src-tauri
          jac setup desktop

      # `jac build` auto-installs [dependencies] inside the sidecar-bundling
      # sub-step, but the prior web-bundle step imports project .jac modules
      # that transitively import websockets/httpx/watchdog/mcp -- so they
      # must be importable before `jac build` starts. `jac install` reads
      # [dependencies] and pip-installs each.
      - name: Install project Python dependencies (jac install)
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: jac install

      # Pin [desktop.plugins] to the audit's fixed config.
      - name: Configure desktop plugins
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          python -c "
          import re
          from pathlib import Path
          p = Path('jac.toml')
          text = p.read_text() if p.exists() else ''
          text = re.sub(r'\[desktop\.plugins\][^\[]*', '', text).rstrip()
          block = (
              '\n\n[desktop.plugins]\n'
              'jac_scale = true\n'
              'byllm = true\n'
              'jac_coder = true\n'
              'jac_mcp = false\n'
              'jac_client = true\n'
          )
          p.write_text(text + block)
          print(p.read_text())
          "

      - name: Disable AppImage on Linux
        if: matrix.platform == 'linux'
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          python3 -c "
          import json
          conf = 'src-tauri/tauri.conf.json'
          with open(conf) as f: c = json.load(f)
          c['bundle']['targets'] = ['deb', 'rpm']
          with open(conf, 'w') as f: json.dump(c, f, indent=2)
          "

      # NSIS handles big bundles (byllm + jac-coder) better than WiX MSI.
      - name: Force NSIS bundle on Windows
        if: matrix.platform == 'windows'
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          python -c "
          import json
          conf = 'src-tauri/tauri.conf.json'
          with open(conf) as f: c = json.load(f)
          c['bundle']['targets'] = ['nsis']
          with open(conf, 'w') as f: json.dump(c, f, indent=2)
          "

      - name: Set Linux AppImage env vars
        if: matrix.platform == 'linux'
        run: |
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"

      # ── jac build (timed) ─────────────────────────────────────
      - name: Build desktop app
        id: build
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        env:
          JAC_BUILD: "1"
        run: |
          START=$SECONDS
          jac build --client desktop --platform ${{ matrix.platform }}
          echo "secs=$((SECONDS-START))" >> "$GITHUB_OUTPUT"
        timeout-minutes: 90

      - name: Measure installer size
        id: size
        if: always() && steps.build.outcome == 'success'
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          exts = {'.exe', '.msi', '.dmg', '.AppImage', '.deb', '.rpm'}
          root = Path('src-tauri/target')
          files = [p for p in root.rglob('*')
                   if p.is_file() and p.suffix in exts] if root.exists() else []
          if files:
              biggest = max(files, key=lambda p: p.stat().st_size)
              size = biggest.stat().st_size
              print(f"bytes={size}")
              print(f"mb={size/1048576:.1f}")
              print(f"path={biggest.as_posix()}")
          else:
              print("bytes=0")
              print("mb=0.0")
              print("path=")
          PY

      - name: Write result JSON
        if: always()
        id: result
        shell: bash
        run: |
          mkdir -p audit-out
          cat > audit-out/result.json <<EOF
          {
            "os": "${{ matrix.os }}",
            "platform": "${{ matrix.platform }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "pip_install_secs": ${{ steps.install.outputs.secs || 'null' }},
            "build_secs": ${{ steps.build.outputs.secs || 'null' }},
            "installer_bytes": ${{ steps.size.outputs.bytes || 'null' }},
            "installer_path": "${{ steps.size.outputs.path }}",
            "build_outcome": "${{ steps.build.outcome }}"
          }
          EOF
          cat audit-out/result.json

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacbuilder-audit-${{ matrix.platform }}
          path: audit-out/result.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload installer artifacts
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jacbuilder-installer-${{ matrix.platform }}
          path: |
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.exe
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.msi
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.dmg
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.AppImage
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.deb
            ${{ env.EXAMPLE_DIR }}/src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: warn
          retention-days: 14

      - name: Per-job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JacBuilder Build Audit — \`${{ matrix.platform }}\`"
            echo ""
            echo "| Phase            | Value |"
            echo "|------------------|-------|"
            echo "| pip install      | ${{ steps.install.outputs.secs }} s |"
            echo "| jac build (total)| ${{ steps.build.outputs.secs }} s |"
            echo "| Installer size   | ${{ steps.size.outputs.mb }} MB (${{ steps.size.outputs.bytes }} bytes) |"
            echo "| Installer path   | \`${{ steps.size.outputs.path }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all audit results
        uses: actions/download-artifact@v4
        with:
          path: audit-data
          pattern: jacbuilder-audit-*

      - name: Build summary table
        env:
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path

          PLATFORMS = ["linux", "macos", "windows"]
          REPO = os.environ["GH_REPO"]
          RUN_ID = os.environ["RUN_ID"]

          results = {}
          root = Path("audit-data")
          if root.exists():
              for d in root.iterdir():
                  rj = d / "result.json"
                  if not rj.exists():
                      continue
                  try:
                      data = json.loads(rj.read_text())
                  except json.JSONDecodeError:
                      continue
                  results[data.get("platform")] = data

          def fmt_int(v):
              return f"{v}" if isinstance(v, (int, float)) else "—"

          def fmt_mb(b):
              return f"{b/1048576:.1f}" if isinstance(b, (int, float)) else "—"

          out = ["## JacBuilder Build Audit", ""]
          out.append(f"Run: [{RUN_ID}](https://github.com/{REPO}/actions/runs/{RUN_ID})")
          out.append("")
          out.append("Config: jac-scale + byllm + jac-coder + jac-client (jac_mcp off).")
          out.append("")
          out.append("| Platform | pip install | jac build | Installer | Outcome |")
          out.append("|---|---|---|---|---|")
          for plat in PLATFORMS:
              r = results.get(plat)
              if not r:
                  out.append(f"| `{plat}` | — | — | — | _no data_ |")
                  continue
              pip_s = fmt_int(r.get("pip_install_secs"))
              build_s = fmt_int(r.get("build_secs"))
              size_mb = fmt_mb(r.get("installer_bytes"))
              outcome = r.get("build_outcome", "?")
              out.append(f"| `{plat}` | {pip_s} s | {build_s} s | {size_mb} MB | {outcome} |")
          out.append("")

          missing = [p for p in PLATFORMS if p not in results]
          if missing:
              out.append("### Missing data")
              out.append("")
              for p in missing:
                  out.append(f"- `{p}`")
              out.append("")

          text = "\n".join(out)
          print(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(text + "\n")
          PY
