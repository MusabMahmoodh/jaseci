name: CI (static gate + label-gated full suite)

# Cost model:
#   Stage 1 - static checks (ALWAYS, every push): policy gate, diff-scoped
#             format, diff-scoped jac check. Cheap fast feedback during WIP.
#   Stage 2 - full suite (ONLY when the PR carries the 'ready-for-review' label):
#             whole-repo (cold) jac check + every test job, all in parallel.
#
# The expensive whole-repo check + full tests run only once a PR is marked ready,
# not on every WIP push. The whole-repo (cold) jac check is the authoritative
# cross-file type gate - the .jir cache is NOT dependency-aware, so a cached
# incremental check would miss cross-file breaks (see proposal doc, section F).
#
# `ready-status` is a single stable required check: it passes when nothing failed
# (skipped heavy jobs on label-less PRs count as ok), so branch protection never
# hangs on "waiting for status".
# Measurement branch; not for merge to main.

on:
  push:
    branches:
      - 'ci-benchmark/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # True only on a PR that carries the 'ready-for-review' label.
  READY: ${{ contains(github.event.pull_request.labels.*.name, 'ready-for-review') }}

jobs:
  # ================= STAGE 1: static checks (always) =================
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Resolve base ref (upstream/main)
        id: base
        run: |
          git remote add upstream https://github.com/jaseci-labs/jaseci.git 2>/dev/null || true
          git fetch upstream main --depth=1 2>/dev/null || true
          BASE=$(git merge-base upstream/main HEAD 2>/dev/null \
                 || git merge-base origin/main HEAD 2>/dev/null || echo "")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved base: ${BASE:-<none>}"
      - name: Policy checks
        env: { BASE: "${{ steps.base.outputs.base }}" }
        run: |
          [ -z "$BASE" ] && { echo "no base; skipping policy checks"; exit 0; }
          if git log "$BASE"..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author trailer found in commits"; exit 1
          fi
          if git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -P '\.py$'; then
            echo "::error::New .py files are not allowed"; exit 1
          fi
          MD=$(git diff --name-only "$BASE"...HEAD -- '*.md' || true)
          if [ -n "$MD" ] && echo "$MD" | xargs -r grep -lP '\xe2\x80\x94' 2>/dev/null; then
            echo "::error::Em-dash (U+2014) found in changed markdown"; exit 1
          fi
      - name: Release-note fragment check
        env:
          CI: "true"
          PRE_COMMIT_FROM_REF: "${{ steps.base.outputs.base }}"
          PRE_COMMIT_TO_REF: HEAD
        run: bash scripts/check-release-notes.sh
      - name: Install jac toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
      - name: Diff-scoped jac format (changed .jac only)
        env: { BASE: "${{ steps.base.outputs.base }}" }
        run: |
          [ -z "$BASE" ] && { echo "no base; skip"; exit 0; }
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.jac' \
            | grep -v '/fixtures/' | grep -v '^scripts/' | grep -v '_err\.jac$' || true)
          [ -z "$CHANGED" ] && { echo "No changed .jac files - format skipped."; exit 0; }
          echo "$CHANGED" | xargs jac format --check --lintfix

  pr-typecheck:
    needs: [pr-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ./jac
          jac install -e ./jac-scale --extras all
          jac install -e ./jac-byllm
      - name: Diff-scoped jac check (changed .jac only)
        run: |
          git remote add upstream https://github.com/jaseci-labs/jaseci.git 2>/dev/null || true
          git fetch upstream main --depth=1 2>/dev/null || true
          BASE=$(git merge-base upstream/main HEAD 2>/dev/null \
                 || git merge-base origin/main HEAD 2>/dev/null || echo "")
          [ -z "$BASE" ] && { jac check . --nowarn; exit $?; }
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.jac' \
            | grep -v '/fixtures/' | grep -v '_err\.jac$' || true)
          [ -z "$CHANGED" ] && { echo "No changed .jac files - skipped."; exit 0; }
          echo "Type-checking changed files (cross-file breaks caught by the ready-for-review full check):"
          echo "$CHANGED"
          jac check $CHANGED --nowarn

  # ============ STAGE 2: full suite (only when 'ready-for-review') ============
  full-typecheck:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ./jac
          jac install -e ./jac-scale --extras all
          jac install -e ./jac-byllm
      - name: Whole-repo jac check (cold, dependency-complete)
        run: |
          jac purge >/dev/null 2>&1 || true
          jac check . --ignore tests checker_*.jac *_err.jac $(grep -v '^#' .jacignore | grep -v '^[[:space:]]*$' | tr '\n' ' ') --nowarn

  full-compiler:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { group: [1, 2, 3] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist pytest-split watchdog
      - run: pytest jac/tests/compiler -n auto --splits 3 --group ${{ matrix.group }}

  full-runtime:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist watchdog
      - run: pytest -x jac -n auto --ignore=jac/tests/compiler

  full-client:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist playwright
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "${{ runner.os }}-playwright-chromium" }
      - run: playwright install chromium --with-deps
      - run: echo "TEST_ENV=true" >> $GITHUB_ENV
      - run: pytest -x jac/tests/runtimelib/client -n auto

  full-scale:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { group: [server, data, microservices, deploy, misc] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac
          jac install -e jac-scale --extras test
          pip install pytest pytest-asyncio requests watchdog websockets
      - run: |
          set +e; failed=""
          for f in jac-scale/jac_scale/tests/${{ matrix.group }}/test_*.jac; do
            echo "::group::$f"; pytest -vv -s "$f" || failed="$failed $f"; echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::Failed:$failed"; exit 1; }

  full-light:
    needs: [pr-gate]
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { suite: [mcp, desktop, solid] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist watchdog
      - name: Run ${{ matrix.suite }}
        env: { JAC_CLIENT_INTEGRATION: "1" }
        run: |
          case "${{ matrix.suite }}" in
            mcp)     jac install -e jac-mcp; pytest -x jac-mcp -n auto ;;
            desktop) pytest -x jac/tests/runtimelib/client/test_desktop_binding.jac -n auto ;;
            solid)   pytest -x -vv jac/tests/runtimelib/test_solid_jsdom.jac ;;
          esac

  # NOTE: on the real repo the k8s jobs (test-scale-k8s, K8s real-app e2e) join
  # Stage 2 here, on Blacksmith. Omitted on the fork (no Blacksmith runner).

  # ============ stable required check + timing summary ============
  ready-status:
    needs: [pr-gate, pr-typecheck, full-typecheck, full-compiler, full-runtime, full-client, full-scale, full-light]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate (fail only if something actually failed)
        run: |
          for r in \
            "${{ needs.pr-gate.result }}" "${{ needs.pr-typecheck.result }}" \
            "${{ needs.full-typecheck.result }}" "${{ needs.full-compiler.result }}" \
            "${{ needs.full-runtime.result }}" "${{ needs.full-client.result }}" \
            "${{ needs.full-scale.result }}" "${{ needs.full-light.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job concluded '$r'"; exit 1
            fi
          done
          echo "All required jobs passed (skipped heavy jobs on label-less PRs are ok). READY=${{ env.READY }}"
      - name: Timing summary
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "## CI timing (READY=${{ env.READY }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Conclusion | Minutes |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|--------:|" >> $GITHUB_STEP_SUMMARY
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.name!="ready-status") | select(.status=="completed") | [.name, .conclusion, (((.completed_at|fromdateiso8601)-(.started_at|fromdateiso8601))/60)] | @tsv' \
            | awk -F'\t' '{printf "| %s | %s | %.1f |\n",$1,$2,$3; if($2!="skipped")s+=$3} END{printf "| **TOTAL (ran)** | | **%.1f** |\n",s}' >> $GITHUB_STEP_SUMMARY
