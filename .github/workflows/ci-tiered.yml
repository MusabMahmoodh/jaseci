name: CI (PR-light + merge-full)

# Two-speed pipeline:
#   PR / push  -> cheap fast feedback only: policy gate, diff-scoped format,
#                 diff-scoped jac check. Runs on every push (the frequent case).
#   merge_group-> the authoritative FULL suite, all jobs in parallel: whole-repo
#                 (cold) jac check + every test job. Runs once per merge (rare).
#
# Why: the .jir cache is NOT dependency-aware (key = own source + impl/test/
# variant/style siblings, not imports), so a cached incremental whole-repo check
# would miss cross-file breaks. The safe + cheap answer is to run the cold
# whole-repo check rarely (pre-merge) instead of on every push.
#
# Requires a merge queue (repo ruleset / branch protection) so merge_group fires.
# Measurement branch; not for merge to main.

on:
  push:
    branches:
      - 'ci-benchmark/**'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # ==================================================================
  # PR / PUSH PATH - cheap, runs on every push
  # ==================================================================
  pr-gate:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Resolve base ref (upstream/main)
        id: base
        run: |
          git remote add upstream https://github.com/jaseci-labs/jaseci.git 2>/dev/null || true
          git fetch upstream main --depth=1 2>/dev/null || true
          BASE=$(git merge-base upstream/main HEAD 2>/dev/null \
                 || git merge-base origin/main HEAD 2>/dev/null || echo "")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved base: ${BASE:-<none>}"
      - name: Policy checks
        env: { BASE: "${{ steps.base.outputs.base }}" }
        run: |
          [ -z "$BASE" ] && { echo "no base; skipping policy checks"; exit 0; }
          if git log "$BASE"..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author trailer found in commits"; exit 1
          fi
          if git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -P '\.py$'; then
            echo "::error::New .py files are not allowed"; exit 1
          fi
          MD=$(git diff --name-only "$BASE"...HEAD -- '*.md' || true)
          if [ -n "$MD" ] && echo "$MD" | xargs -r grep -lP '\xe2\x80\x94' 2>/dev/null; then
            echo "::error::Em-dash (U+2014) found in changed markdown"; exit 1
          fi
      - name: Release-note fragment check
        env:
          CI: "true"
          PRE_COMMIT_FROM_REF: "${{ steps.base.outputs.base }}"
          PRE_COMMIT_TO_REF: HEAD
        run: bash scripts/check-release-notes.sh
      - name: Install jac toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e jac
      - name: Diff-scoped jac format (changed .jac only)
        env: { BASE: "${{ steps.base.outputs.base }}" }
        run: |
          [ -z "$BASE" ] && { echo "no base; skip"; exit 0; }
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.jac' \
            | grep -v '/fixtures/' | grep -v '^scripts/' | grep -v '_err\.jac$' || true)
          [ -z "$CHANGED" ] && { echo "No changed .jac files - format skipped."; exit 0; }
          echo "$CHANGED" | xargs jac format --check --lintfix

  pr-typecheck:
    if: github.event_name != 'merge_group'
    needs: [pr-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ./jac
          jac install -e ./jac-scale --extras all
          jac install -e ./jac-byllm
      - name: Diff-scoped jac check (changed .jac only)
        run: |
          git remote add upstream https://github.com/jaseci-labs/jaseci.git 2>/dev/null || true
          git fetch upstream main --depth=1 2>/dev/null || true
          BASE=$(git merge-base upstream/main HEAD 2>/dev/null \
                 || git merge-base origin/main HEAD 2>/dev/null || echo "")
          [ -z "$BASE" ] && { jac check . --nowarn; exit $?; }
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.jac' \
            | grep -v '/fixtures/' | grep -v '_err\.jac$' || true)
          [ -z "$CHANGED" ] && { echo "No changed .jac files - diff-scoped check skipped."; exit 0; }
          echo "Type-checking changed files (cross-file breaks caught by the merge-queue full check):"
          echo "$CHANGED"
          jac check $CHANGED --nowarn

  # ==================================================================
  # MERGE PATH - authoritative FULL suite, all parallel, runs once per merge
  # ==================================================================
  merge-typecheck-full:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ./jac
          jac install -e ./jac-scale --extras all
          jac install -e ./jac-byllm
      - name: Whole-repo jac check (cold, dependency-complete)
        run: |
          jac purge >/dev/null 2>&1 || true
          jac check . --ignore tests checker_*.jac *_err.jac $(grep -v '^#' .jacignore | grep -v '^[[:space:]]*$' | tr '\n' ' ') --nowarn

  merge-compiler:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { group: [1, 2, 3] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist pytest-split watchdog
      - run: pytest jac/tests/compiler -n auto --splits 3 --group ${{ matrix.group }}

  merge-runtime:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist watchdog
      - run: pytest -x jac -n auto --ignore=jac/tests/compiler

  merge-client:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist playwright
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "${{ runner.os }}-playwright-chromium" }
      - run: playwright install chromium --with-deps
      - run: echo "TEST_ENV=true" >> $GITHUB_ENV
      - run: pytest -x jac/tests/runtimelib/client -n auto

  merge-scale:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { group: [server, data, microservices, deploy, misc] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac
          jac install -e jac-scale --extras test
          pip install pytest pytest-asyncio requests watchdog websockets
      - run: |
          set +e; failed=""
          for f in jac-scale/jac_scale/tests/${{ matrix.group }}/test_*.jac; do
            echo "::group::$f"; pytest -vv -s "$f" || failed="$failed $f"; echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::Failed:$failed"; exit 1; }

  merge-light:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { suite: [mcp, desktop, solid] } }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: oven-sh/setup-bun@v2
      - run: |
          python -m pip install --upgrade pip
          pip install -e jac pytest pytest-xdist watchdog
      - name: Run ${{ matrix.suite }}
        env: { JAC_CLIENT_INTEGRATION: "1" }
        run: |
          case "${{ matrix.suite }}" in
            mcp)     jac install -e jac-mcp; pytest -x jac-mcp -n auto ;;
            desktop) pytest -x jac/tests/runtimelib/client/test_desktop_binding.jac -n auto ;;
            solid)   pytest -x -vv jac/tests/runtimelib/test_solid_jsdom.jac ;;
          esac

  # NOTE: on the real repo, the k8s jobs (test-scale-k8s, K8s real-app e2e) run
  # here too, on Blacksmith (fast disk/network). Omitted on the fork (no runner).

  report:
    needs: [pr-gate, pr-typecheck, merge-typecheck-full, merge-compiler, merge-runtime, merge-client, merge-scale, merge-light]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Timing report
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "## ${{ github.event_name }} path - timing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Conclusion | Minutes |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|--------:|" >> $GITHUB_STEP_SUMMARY
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.name!="report") | select(.status=="completed") | [.name, .conclusion, (((.completed_at|fromdateiso8601)-(.started_at|fromdateiso8601))/60)] | @tsv' \
            | awk -F'\t' '{printf "| %s | %s | %.1f |\n",$1,$2,$3; s+=$3} END{printf "| **TOTAL** | | **%.1f** |\n",s}' >> $GITHUB_STEP_SUMMARY
